<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepResearch.se — documentation viewer</title>
  <link rel="icon" href="/favicon.ico?v=4" sizes="48x48">
  <meta name="theme-color" content="#0d1117">
  <style>
    :root {
      --bg: #eef2f7; --panel: #ffffff; --border: #d7dee7; --text: #16202c;
      --muted: #5b6b7c; --accent: #2563eb; --side: #f6f8fb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14; --panel: #121821; --border: #263140; --text: #dbe4ee;
        --muted: #8fa1b3; --accent: #5b9bff; --side: #0f151d;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr;
      grid-template-areas: "head head" "side main"; height: 100vh;
    }
    header {
      grid-area: head; display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: .7rem 1rem; background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 700; }
    header .note { font-size: .8rem; color: var(--muted); }
    header a.back { color: var(--accent); text-decoration: none; font-size: .85rem; font-weight: 600; }
    nav {
      grid-area: side; background: var(--side); border-right: 1px solid var(--border);
      overflow-y: auto; padding: .5rem;
    }
    nav input {
      width: 100%; padding: .45rem .6rem; margin-bottom: .5rem; font: inherit;
      border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text);
    }
    nav a {
      display: flex; align-items: center; justify-content: space-between; gap: .4rem;
      padding: .38rem .55rem; border-radius: 7px; text-decoration: none; color: var(--text);
      font-size: .84rem; cursor: pointer;
    }
    nav a:hover { background: var(--border); }
    nav a.active { background: var(--accent); color: #fff; }
    nav a .badge {
      font-size: .62rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      padding: .08rem .32rem; border-radius: 999px; background: rgba(37,99,235,.16); color: var(--accent);
    }
    nav a.active .badge { background: rgba(255,255,255,.25); color: #fff; }
    nav .group { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: .8rem .55rem .25rem; }
    main { grid-area: main; overflow-y: auto; }
    article { max-width: 820px; margin: 0 auto; padding: 1.5rem 1.6rem 6rem; }
    .status {
      font-size: .82rem; color: var(--muted); background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px; padding: .5rem .7rem; margin-bottom: 1rem;
    }
    .status b { color: var(--text); }
    .doc h1 { font-size: 1.7rem; margin: .2rem 0 1rem; }
    .doc h2 { font-size: 1.3rem; margin: 1.8rem 0 .6rem; border-bottom: 1px solid var(--border); padding-bottom: .25rem; }
    .doc h3 { font-size: 1.08rem; margin: 1.3rem 0 .4rem; }
    .doc p, .doc li { font-size: .95rem; }
    .doc code { background: var(--side); border: 1px solid var(--border); border-radius: 4px; padding: 0 .3rem; font-size: .86em; }
    .doc pre { background: var(--side); border: 1px solid var(--border); border-radius: 10px; padding: .8rem 1rem; overflow-x: auto; }
    .doc pre code { border: 0; padding: 0; background: none; }
    .doc table { border-collapse: collapse; display: block; overflow-x: auto; margin: .8rem 0; }
    .doc th, .doc td { border: 1px solid var(--border); padding: .4rem .6rem; font-size: .88rem; text-align: left; }
    .doc img.doc-img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; }
    .doc a { color: var(--accent); }
    .empty { color: var(--muted); padding: 2rem 0; }

    /* ---- comment mode (admin only; docs-comments.js mounts into it) ---- */
    #mode { display: flex; align-items: center; gap: .3rem; }
    #mode .mode-label {
      font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      margin-right: .2rem;
    }
    #mode .mode-btn {
      font: inherit; font-size: .78rem; padding: .22rem .6rem; cursor: pointer;
      border: 1px solid var(--border); background: var(--side); color: var(--muted);
      border-radius: 999px;
    }
    #mode .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    /* In comment mode the prose invites selection and nothing else. */
    body.commenting .doc { cursor: text; }
    body.commenting .doc a { pointer-events: none; }
    .doc mark.dc-mark {
      background: rgba(240, 173, 78, .35); color: inherit; border-bottom: 2px solid #f0ad4e;
      border-radius: 2px; padding: 0 1px; cursor: pointer;
    }
    .doc mark.dc-mark.flash { background: rgba(240, 173, 78, .8); transition: background .3s; }
    #rail {
      grid-area: rail; overflow-y: auto; padding: 1rem .8rem 4rem;
      background: var(--side); border-left: 1px solid var(--border);
    }
    #rail[hidden] { display: none; }
    body.has-rail { grid-template-columns: 280px 1fr 320px; grid-template-areas: "head head head" "side main rail"; }
    .dc-railhead { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .6rem; }
    .dc-empty { font-size: .82rem; color: var(--muted); }
    .dc-card, .dc-composer {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: .6rem .7rem; margin-bottom: .7rem; font-size: .82rem;
    }
    .dc-card { cursor: pointer; }
    .dc-card.stale { border-style: dashed; opacity: .85; }
    .dc-composer { border-color: var(--accent); cursor: auto; }
    .dc-cardhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
    .dc-status {
      font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      padding: .08rem .38rem; border-radius: 999px; background: rgba(37,99,235,.16); color: var(--accent);
    }
    .dc-status.resolved, .dc-status.declined { background: rgba(90,160,110,.18); color: #3d8f5b; }
    .dc-date { font-size: .7rem; color: var(--muted); }
    .dc-quote {
      border-left: 3px solid #f0ad4e; padding: .1rem .5rem; margin: 0 0 .45rem;
      color: var(--muted); font-style: italic;
    }
    .dc-hint { font-size: .74rem; color: var(--muted); margin: .1rem 0 .5rem; }
    .dc-note { white-space: pre-wrap; }
    .dc-stale { font-size: .74rem; color: #b4690e; margin: .2rem 0 .45rem; }
    .dc-msg {
      margin-top: .5rem; padding: .4rem .5rem; border-radius: 8px; background: var(--side);
      white-space: pre-wrap;
    }
    .dc-msg.agent { background: rgba(37,99,235,.08); }
    .dc-who { display: block; font-size: .64rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .dc-composer textarea, .dc-reply textarea {
      width: 100%; font: inherit; font-size: .82rem; padding: .4rem .5rem; resize: vertical;
      border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
    }
    .dc-actions { display: flex; align-items: center; gap: .4rem; margin-top: .4rem; }
    .dc-cardactions { display: flex; gap: .4rem; margin-top: .5rem; }
    .dc-actions button, .dc-cardactions button {
      font: inherit; font-size: .76rem; padding: .22rem .6rem; cursor: pointer;
      border: 1px solid var(--border); border-radius: 7px; background: var(--side); color: var(--text);
    }
    .dc-actions .dc-send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .dc-actions .dc-msg { font-size: .74rem; color: var(--muted); background: none; padding: 0; margin: 0; }
    .dc-reply { margin-top: .5rem; }

    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-areas: "head" "side" "main"; height: auto; }
      body.has-rail { grid-template-columns: 1fr; grid-template-areas: "head" "side" "main" "rail"; }
      nav { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); }
      #rail { border-left: 0; border-top: 1px solid var(--border); }
      header { flex-wrap: wrap; }
      header .note { display: none; }
    }
  </style>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
</head>
<body>
  <header>
    <h1>DeepResearch.se documentation</h1>
    <span class="note">The project's living documentation, straight from the repo.</span>
    <!-- Comment mode's Read / Comment switch: shown only for an admin identity
         (docs-viewer.js mounts docs-comments.js after /api/me confirms it). -->
    <div id="mode" hidden></div>
    <a class="back" href="/rver">← App</a>
  </header>
  <nav>
    <input id="filter" type="search" placeholder="Filter documents…" aria-label="Filter documents">
    <div id="list"></div>
  </nav>
  <main>
    <article>
      <div id="status" class="status" hidden></div>
      <div id="doc" class="doc"><p class="empty">Loading documentation…</p></div>
    </article>
  </main>
  <!-- The comment rail: the margin comment mode writes into. -->
  <aside id="rail" hidden></aside>
  <script type="module" src="/js/docs-viewer.js"></script>
</body>
</html>
