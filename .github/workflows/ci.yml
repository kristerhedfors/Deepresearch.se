# Unit tests + type-check on every push and pull request.
#
# Closes gap A1 in docs/TESTING-GAP-ANALYSIS.md: before this existed nothing
# ran the suite but a human (or an agent following the **pr** skill), on a
# repo that auto-deploys from `main`. The suite is ~20 s and needs no
# credentials, no D1, and no network — everything that touches a live
# provider stays in the e2e/eval harnesses, which are deliberately NOT run
# here (they spend tokens and need break-glass auth; see docs/TESTING.md).
#
# `npm ci` also fixes gap A3: a fresh clone has none of the three root
# devDependencies (@cloudflare/workers-types, cheerio, typescript), so
# `npm run typecheck` used to die with a confusing TS2688. `npm test` needs
# the install too: `scripts/arxiv-html.mjs` imports `cheerio` (dev-only, added
# 2026-07-27 for one offline harvest script's DOM walk — docs/DEPENDENCIES.md
# §8.1) and its unit suite runs in the same command.
name: CI

# `push: branches: [main]` + `pull_request`, NOT `push: ["**"]`: a branch with
# an open PR fires both events on the same SHA, so every PR push ran the whole
# suite twice for one bit of signal (observed on PR #255's own first pushes).
# Feature-branch pushes are covered by the PR run; `main` is covered by push,
# which is what the auto-deploy actually follows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run. Keyed by workflow
# AND ref so the push-on-main and pull_request runs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the container this repo is developed in. The Worker
      # itself runs on workerd, not Node — this pins only the test runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # node:test, no framework. Includes the committed-artifact freshness
      # checks — a failure here usually means `npm run bundle`,
      # `bundle:rag`, `bundle:docs` or `bundle:docs-rag` needs re-running and
      # committing, never that the artifact should be hand-edited.
      - name: Unit tests
        run: npm test

      # Zero-build-step tsc over both projects (src/ with Workers types,
      # public/ with DOM lib), strict, opt-in per file via // @ts-check.
      - name: Type-check
        run: npm run typecheck

      # The coverage RATCHET (scripts/coverage.mjs). Re-runs the suite under
      # node's built-in coverage and fails if the measured numbers fall below
      # docs/coverage-baseline.json — so the untested surface can shrink but
      # not quietly grow back. It also fails, with no tolerance, when a module
      # that WAS reached by some test stops being reached at all.
      #
      # Deliberately a separate step after the plain run: a coverage-
      # instrumented suite is slower and its failures read differently, and a
      # red ratchet on a green suite should say "coverage regressed", not
      # "tests failed". Raise the floor with `npm run coverage -- --save`.
      - name: Coverage ratchet
        run: npm run coverage:check

  # pygram: build the REAL artifact and execute it.
  #
  # docs/PYGRAM.md §2 accepts pygram on three numbers that no unit test can
  # stand in for — statically linked, under 700 KB stripped, and at most three
  # file opens on `-c 'pass'` — because the sandbox cost model is bytes and
  # path probes fetched over a WebSocket, not CPU. All three are properties of
  # a compiled i386 binary, so the only honest gate compiles one.
  #
  # This is affordable because of a finding in docs/PYGRAM-RESEARCH.md §2.1:
  # i386 binaries EXECUTE on an ordinary x86-64 Linux runner, so the target
  # artifact can be built and run here with no Docker, no VM, no emulator and
  # no cross toolchain — install gcc-multilib, build musl for i386 from source
  # in about a minute, build the variant, run it. Network is needed once, for
  # two pinned downloads.
  #
  # Deliberately its own job: it is slower than the unit suite and its failures
  # read differently ("the binary grew past the gate" is not "a test broke").
  pygram:
    name: pygram (build + gates + conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The 32-bit host toolchain. Ubuntu's musl-tools is NOT a substitute:
      # it is x86_64-only and ships no 32-bit musl libc, so its -m32 mode
      # cannot work. scripts/pygram-build.sh builds musl from source instead.
      - name: Install the i386 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 strace file

      # Cache only the parts that depend purely on the pinned musl version:
      # the tarball and the built prefix. The MicroPython checkout and the
      # object files are deliberately NOT cached, so every run compiles the
      # variant and the port patch from the pinned tag — a stale cache serving
      # yesterday's binary would silently pass the gates it exists to enforce.
      - name: Cache the musl-i386 toolchain
        uses: actions/cache@v4
        with:
          path: |
            pygram/.build/dl
            pygram/.build/musl-i386
          key: musl-i386-${{ hashFiles('scripts/pygram-build.sh') }}

      # Builds, then runs the smoke checks that are contracts rather than
      # measurements: sys.argv shapes, the pinned sys.path, and both halves of
      # the unsupported contract — exit 90 with one stderr line for a module
      # CPython has, exit 1 for one it does not.
      - name: Build pygram
        run: bash scripts/pygram-build.sh

      # static / size / file opens, with the system CPython printed alongside
      # as the baseline being replaced.
      - name: Size and file-open gate
        run: node scripts/pygram-gate.mjs pygram/build/pygram --compare

      # Every corpus entry run twice — once by CPython, once by pygram — and
      # diffed on stdout and exit code. MISMATCH is a hard failure; UNSUPPORTED
      # (exit 90 with the contract line) is coverage, not failure, and is what
      # the build order is read from.
      - name: Conformance against CPython
        run: PYGRAM_BIN=$PWD/pygram/build/pygram node tests/pygram/conformance.mjs

      # The build log names WHY a compile failed, and 40 lines of tail in the
      # step output is rarely the interesting part.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pygram-build-logs
          path: pygram/.build/*.log
          retention-days: 7
          if-no-files-found: ignore

  # The browser suite, against a Worker started on the runner — no credentials,
  # no deployment, no tokens spent. Closes gap A4 in
  # docs/TESTING-GAP-ANALYSIS.md: these 63 tests already existed and were free,
  # and nothing ran them, because the config required production break-glass
  # secrets and defaulted to the live site.
  #
  # Two servers come up (tests/playwright.config.js `webServer`): a
  # dependency-free provider stand-in (tests/fake-provider.mjs) and
  # `wrangler dev` on wrangler.dev.toml. Separate job from the unit tests so a
  # browser failure is legible on its own and does not delay the fast gate.
  e2e:
    name: e2e (mocked, local Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install e2e dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # The fixtures are generated, not committed. Pillow is only needed for
      # the EXIF JPEG; without it make_fixtures.py skips that one file and the
      # metadata specs fail on a missing fixture rather than on a real defect.
      - name: Build fixtures
        working-directory: tests
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          npm run fixtures

      - name: Playwright (mocked project, local Worker)
        working-directory: tests
        run: npm run test:local

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/test-results/
          retention-days: 7

      # The wrangler crash log — the file that names WHY workerd exited.
      #
      # `wrangler dev` has now died mid-run on four consecutive PRs (#354, #355,
      # #356, #357), each time with the same fingerprint: workerd `Broken pipe`
      # disconnects, then a blank `✘ [ERROR]`, then every remaining test gets
      # ERR_CONNECTION_REFUSED. Each time the diff was innocent and each time
      # the real reason was in a file CI threw away — wrangler prints its path
      # ("Logs were written to …") on the way out and nothing collected it.
      # docs/TESTING.md called for capturing it "before the fourth occurrence".
      #
      # `if: failure()` and a short retention, so a green run costs nothing.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          retention-days: 7
          if-no-files-found: ignore
