# Unit tests + type-check on every push and pull request.
#
# Closes gap A1 in docs/TESTING-GAP-ANALYSIS.md: before this existed nothing
# ran the suite but a human (or an agent following the **pr** skill), on a
# repo that auto-deploys from `main`. The suite is ~20 s and needs no
# credentials, no D1, and no network — everything that touches a live
# provider stays in the e2e/eval harnesses, which are deliberately NOT run
# here (they spend tokens and need break-glass auth; see docs/TESTING.md).
#
# `npm ci` also fixes gap A3: the type-check needs the root devDependencies
# (@cloudflare/workers-types, typescript), and a fresh clone has none, so
# `npm run typecheck` used to die with a confusing TS2688.
name: CI

# `push: branches: [main]` + `pull_request`, NOT `push: ["**"]`: a branch with
# an open PR fires both events on the same SHA, so every PR push ran the whole
# suite twice for one bit of signal (observed on PR #255's own first pushes).
# Feature-branch pushes are covered by the PR run; `main` is covered by push,
# which is what the auto-deploy actually follows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run. Keyed by workflow
# AND ref so the push-on-main and pull_request runs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the container this repo is developed in. The Worker
      # itself runs on workerd, not Node — this pins only the test runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # node:test, no framework. Includes the committed-artifact freshness
      # checks — a failure here usually means `npm run bundle`,
      # `bundle:rag`, `bundle:docs` or `bundle:docs-rag` needs re-running and
      # committing, never that the artifact should be hand-edited.
      - name: Unit tests
        run: npm test

      # Zero-build-step tsc over both projects (src/ with Workers types,
      # public/ with DOM lib), strict, opt-in per file via // @ts-check.
      - name: Type-check
        run: npm run typecheck

      # The coverage RATCHET (scripts/coverage.mjs). Re-runs the suite under
      # node's built-in coverage and fails if the measured numbers fall below
      # docs/coverage-baseline.json — so the untested surface can shrink but
      # not quietly grow back. It also fails, with no tolerance, when a module
      # that WAS reached by some test stops being reached at all.
      #
      # Deliberately a separate step after the plain run: a coverage-
      # instrumented suite is slower and its failures read differently, and a
      # red ratchet on a green suite should say "coverage regressed", not
      # "tests failed". Raise the floor with `npm run coverage -- --save`.
      - name: Coverage ratchet
        run: npm run coverage:check

  # The browser suite, against a Worker started on the runner — no credentials,
  # no deployment, no tokens spent. Closes gap A4 in
  # docs/TESTING-GAP-ANALYSIS.md: these 63 tests already existed and were free,
  # and nothing ran them, because the config required production break-glass
  # secrets and defaulted to the live site.
  #
  # Two servers come up (tests/playwright.config.js `webServer`): a
  # dependency-free provider stand-in (tests/fake-provider.mjs) and
  # `wrangler dev` on wrangler.dev.toml. Separate job from the unit tests so a
  # browser failure is legible on its own and does not delay the fast gate.
  e2e:
    name: e2e (mocked, local Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install e2e dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # The fixtures are generated, not committed. Pillow is only needed for
      # the EXIF JPEG; without it make_fixtures.py skips that one file and the
      # metadata specs fail on a missing fixture rather than on a real defect.
      - name: Build fixtures
        working-directory: tests
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          npm run fixtures

      - name: Playwright (mocked project, local Worker)
        working-directory: tests
        run: npm run test:local

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/test-results/
          retention-days: 7

      # The wrangler crash log — the file that names WHY workerd exited.
      #
      # `wrangler dev` has now died mid-run on four consecutive PRs (#354, #355,
      # #356, #357), each time with the same fingerprint: workerd `Broken pipe`
      # disconnects, then a blank `✘ [ERROR]`, then every remaining test gets
      # ERR_CONNECTION_REFUSED. Each time the diff was innocent and each time
      # the real reason was in a file CI threw away — wrangler prints its path
      # ("Logs were written to …") on the way out and nothing collected it.
      # docs/TESTING.md called for capturing it "before the fourth occurrence".
      #
      # `if: failure()` and a short retention, so a green run costs nothing.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          retention-days: 7
          if-no-files-found: ignore
